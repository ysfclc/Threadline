name: Build Threadline APK

on:
workflow_dispatch:
push:
branches: [main, master]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Check out repository
uses: actions/checkout@v4

  - name: Install Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Android SDK packages
    run: |
      yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.13'

  - name: Extract source code
    run: unzip -o threadline-app.zip

  - name: Test and build APK
    working-directory: threadline-app
    run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

  - name: Save APK
    uses: actions/upload-artifact@v4
    with:
      name: threadline-debug-apk
      path: threadline-app/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
